<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2</title>
    <link rel="stylesheet" href="07_project2.css">
    </head>
   <body>
     <div class="container">
        <h2>BMI Calculator</h2>
     <form> 
      <input type="radio" id="rbtn1" name="Unit">
      <label id="rbtn1label">US Customary</label> 

      <input type="radio" id="rbtn2" name="Unit">
      <label id="rbtn2label">Metric Units</label>

        <p id="span1">
        <label for="height">Height:</label>  
        <input type="text" class="height">
        <label id="heightunit1"></label>
      </p> 

      <p id="span2">
        <label for="weight">Weight:</label>
        <input type="text" class="weight">
        <label id="weightunit1"></label>
      </p>

        <div id="results"></div>

        <button id="btn" type="submit">Compute BMI</button>
        
        <div id="weight-guide"> 
            <h3>BMI Weight Guid</h3>-
            <P>Under Weight = less than 18.6</P>
            <p>Normal Range = 18.6 and 24.9</p>
            <p>Overweight = Greater than 24.9</p>
        </div>

        <button type="reset" id="Reset">Reset</button>
     </form>
     </div>

<script src="07_project2.js"></script>
</body>
 
 </html>
